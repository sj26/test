name: GHA issue comment default conformance

on: issue_comment

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Record event context
        env:
          ACTION: ${{ github.event.action }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          jq -cn \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg action "$ACTION" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg repository "$REPOSITORY" \
            --arg issue_number "$ISSUE_NUMBER" \
            --arg comment_id "$COMMENT_ID" \
            --arg is_pull_request "$IS_PULL_REQUEST" \
            '{event: $event, action: $action, ref: $ref, sha: $sha, workflow: $workflow, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha, repository: $repository, issue_number: $issue_number, comment_id: $comment_id, is_pull_request: ($is_pull_request == "true")}'
