name: PR activity E2E A08 reopened
on:
  pull_request:
    types: [reopened]

permissions: {}

jobs:
  evidence:
    name: event evidence
    runs-on: ubuntu-latest
    steps:
      - name: Verify event context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test '${{ github.event.action }}' = 'reopened'
          printf 'E2E_CASE=%s\n' 'A08'
          printf 'PULL_REQUEST_ACTION=%s\n' '${{ github.event.action }}'
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
