name: "GHA parity F9"

on:
  pull_request:
    branches: ['gha-parity-20260902-0513-f9-*', '!gha-parity-20260902-0513-f9-excluded*', 'gha-parity-20260902-0513-f9-excluded-reincluded']

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Emit parity evidence
        shell: bash
        run: |
          printf 'PARITY_EVIDENCE case=%s event=%s workflow=%s ref=%s sha=%s head_ref=%s base_ref=%s action=%s\n' \
            'F9' "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF" '${{ github.event.action }}'
