name: PB-3321 explicit release types B corpus parity

# Multi-event workflow and event-specific job shape follows
# bitdefender/bddisasm .github/workflows/ci.yml.
on:
  release:
    types: [unpublished, created, deleted, released]

permissions:
  contents: read

jobs:
  observe:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record selected release activity
        env:
          ACTION: ${{ github.event.action }}
        run: |
          case "$ACTION" in
            unpublished|created|deleted|released) ;;
            *) echo "unexpected action: $ACTION" >&2; exit 1 ;;
          esac
          printf '%s\n' "$GITHUB_EVENT_NAME:$ACTION:$GITHUB_REF:$GITHUB_SHA"
