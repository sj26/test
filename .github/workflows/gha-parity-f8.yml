name: "GHA parity F8"

on:
  pull_request:
    branches-ignore: [gha-parity-20260902-0513-f8-ignored]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Emit parity evidence
        shell: bash
        run: |
          printf 'PARITY_EVIDENCE case=%s event=%s workflow=%s ref=%s sha=%s head_ref=%s base_ref=%s action=%s\n' \
            'F8' "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF" '${{ github.event.action }}'
