name: PR activity parity A03 labeled
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  evidence:
    name: event evidence
    runs-on: ubuntu-latest
    steps:
      - name: Capture event context
        shell: bash
        run: |
          printf 'PARITY_CASE=%s\n' 'A03'
          printf 'GITHUB_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
          printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
          printf 'GITHUB_HEAD_REF=%s\n' "$GITHUB_HEAD_REF"
          printf 'GITHUB_BASE_REF=%s\n' "$GITHUB_BASE_REF"
          printf 'PULL_REQUEST_ACTION=%s\n' '${{ github.event.action }}'
