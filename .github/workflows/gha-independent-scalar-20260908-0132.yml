name: GHA independent scalar verification 20260908
on:
  issues:
    types: []
  issue_comment:
    types: []
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Allowlisted context only
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          jq -c \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$WORKFLOW_REF" --arg workflow_sha "$WORKFLOW_SHA" \
            '{event: $event, action, issue_id: .issue.id, issue_number: .issue.number,
              comment_id: .comment.id, is_pull_request: (.issue.pull_request != null),
              repository_id: .repository.id, ref: $ref, sha: $sha,
              workflow: $workflow, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha,
              issue_skip: (.issue.title | contains("[skip ci]")),
              body_skip: ((.comment.body // .issue.body // "") | contains("[skip ci]"))}' \
            "$GITHUB_EVENT_PATH"
